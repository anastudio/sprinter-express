    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1220; }
    ::-webkit-scrollbar-thumb { background: #2a3454; border-radius: 3px; }
    input, select, textarea, button { font-family: inherit; }
    option { background: #141929; color: #e2e8f0; }

</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

    car: { make: "BMW", model: "X5", year: 2021, color: "Black", vin: "5UXCR6C08M9E12345", mileage: 42000 },
    description: "Routine oil change — oil and filters",
    masterId: 2, hoursSpent: 0, laborRate: 40,
    extraWork: [],

// ─── UTILS ────────────────────────────────────────────────────────────────────
const STATUS_MAP = {
  waiting:     { label: "Waiting",     color: "#f59e0b" },
  in_progress: { label: "In Progress", color: "#3b82f6" },
  done:        { label: "Done",        color: "#10b981" },
  cancelled:   { label: "Cancelled",   color: "#ef4444" },
};

const PART_CATEGORIES = ["Brakes","Fluids","Filters","Ignition","Engine","Electrical","Suspension","Exhaust","Other"];

const calcTotal = (order) => {
  const parts       = order.parts.reduce((s, p) => s + p.qty * p.price, 0);
  const labor       = order.hoursSpent * (order.laborRate || 0);
  const extraItems  = order.extraWork || [];
  const extraLabor  = extraItems.reduce((s, e) => s + (e.hours || 0) * (order.laborRate || 0), 0);
  return { parts, labor, extraLabor, total: parts + labor + extraLabor };
};

const fmt = (n) => "$" + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

// ─── SHARED STYLES ────────────────────────────────────────────────────────────
const inputStyle = {
  width: "100%", background: "#0d1424", border: "1px solid #2a3454", borderRadius: 8,
  color: "#e2e8f0", padding: "9px 12px", fontSize: 14, outline: "none",
  boxSizing: "border-box", fontFamily: "inherit",
};
const selectStyle = { ...inputStyle, cursor: "pointer" };
const btnPrimary = {
  background: "linear-gradient(135deg,#1d4ed8,#2563eb)", color: "#fff",
  border: "none", borderRadius: 8, padding: "9px 20px", cursor: "pointer",
  fontSize: 13, fontWeight: 600,
};
const btnGhost = {
  background: "none", border: "1px solid #2a3454", color: "#94a3b8",
  borderRadius: 8, padding: "9px 18px", cursor: "pointer", fontSize: 13,
};

// ─── SMALL COMPONENTS ─────────────────────────────────────────────────────────
function Badge({ status }) {
  const s = STATUS_MAP[status];
  return (
    <span style={{
      background: s.color + "22", color: s.color,
      border: `1px solid ${s.color}55`,
      borderRadius: 6, padding: "2px 10px", fontSize: 12, fontWeight: 600,
    }}>{s.label}</span>
  );
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(10,14,26,0.75)",
      backdropFilter: "blur(4px)", display: "flex", alignItems: "center",
      justifyContent: "center", zIndex: 1000, padding: 16,
    }}>
      <div style={{
        background: "#141929", border: "1px solid #2a3454", borderRadius: 16,
        width: "100%", maxWidth: wide ? 820 : 680, maxHeight: "92vh", overflowY: "auto",
        boxShadow: "0 32px 80px rgba(0,0,0,0.6)",
      }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 24px", borderBottom: "1px solid #1e2740" }}>
          <h3 style={{ margin: 0, fontSize: 17, color: "#e2e8f0", fontFamily: "inherit" }}>{title}</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: 22, lineHeight: 1 }}>×</button>
        </div>
        <div style={{ padding: 24 }}>{children}</div>
      </div>
    </div>
  );
}

function Field({ label, children, half, third }) {
  const w = half ? "calc(50% - 6px)" : third ? "calc(33.3% - 8px)" : "100%";
  return (
    <div style={{ marginBottom: 14, width: w }}>
      <label style={{ display: "block", fontSize: 11, color: "#64748b", marginBottom: 5, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</label>
      {children}
    </div>
  );
}

function Input({ value, onChange, placeholder, type = "text", mono, maxLength }) {
  return (
    <input type={type} value={value} onChange={e => onChange(e.target.value)}
      placeholder={placeholder} maxLength={maxLength}
      style={{ ...inputStyle, ...(mono ? { fontFamily: "monospace", letterSpacing: "0.08em" } : {}) }} />
  );
}

function Select({ value, onChange, options }) {
  return (
    <select value={value} onChange={e => onChange(e.target.value)} style={selectStyle}>
      {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

// INVOICE PRINT VIEW
// ═══════════════════════════════════════════════════════════════════════════════
function InvoiceModal({ order, clients, masters, onClose }) {
  const client  = clients.find(c => c.id === order.clientId);
  const master  = masters.find(m => m.id === order.masterId);
  const totals  = calcTotal(order);
  const invoiceNum = "INV-" + String(order.id).padStart(4, "0");
  const today   = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

  const printRef = useRef();
  const handlePrint = () => {
    const content = printRef.current.innerHTML;
    const win = window.open("", "_blank");
    win.document.write(`<html><head><title>Invoice ${invoiceNum}</title>
      <style>
        body { font-family: Arial, sans-serif; color: #111; margin: 0; padding: 32px; }
        table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        th { background: #f1f5f9; text-align: left; padding: 8px 10px; font-size: 12px; text-transform: uppercase; }
        td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 32px; }
        .logo { font-size: 22px; font-weight: 800; }
        .total-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; max-width: 280px; margin-left: auto; margin-top: 16px; }
        .total-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 13px; }
        .grand { font-size: 17px; font-weight: 800; border-top: 2px solid #cbd5e1; padding-top: 8px; margin-top: 8px; }
        h3 { font-size: 13px; text-transform: uppercase; color: #64748b; margin: 20px 0 6px; }
      </style></head><body>${content}</body></html>`);
    win.document.close();
    win.print();
  };

  return (
    <Modal title={`Invoice ${invoiceNum}`} onClose={onClose} wide>
      {/* Print-friendly content */}
      <div ref={printRef}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 28 }}>
          <div>
            <div style={{ fontSize: 22, fontWeight: 800, color: "#e2e8f0" }}>🔧 AutoService PRO</div>
            <div style={{ fontSize: 12, color: "#64748b", marginTop: 4 }}>123 Mechanic Ave, Auto City, CA 90001</div>
            <div style={{ fontSize: 12, color: "#64748b" }}>(555) 800-0000 · info@autoservice.com</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#60a5fa" }}>{invoiceNum}</div>
            <div style={{ fontSize: 12, color: "#64748b", marginTop: 4 }}>Date: {today}</div>
            <div style={{ marginTop: 8 }}><Badge status={order.status} /></div>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
          <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 11, color: "#64748b", fontWeight: 700, textTransform: "uppercase", marginBottom: 8 }}>Bill To</div>
            <div style={{ fontWeight: 700, color: "#e2e8f0" }}>{client?.name || "—"}</div>
            <div style={{ fontSize: 13, color: "#94a3b8" }}>{client?.phone}</div>
            <div style={{ fontSize: 13, color: "#94a3b8" }}>{client?.email}</div>
          </div>
          <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 11, color: "#64748b", fontWeight: 700, textTransform: "uppercase", marginBottom: 8 }}>Vehicle</div>
            <div style={{ fontWeight: 700, color: "#e2e8f0" }}>{order.car.year} {order.car.make} {order.car.model}</div>
            <div style={{ fontSize: 13, color: "#94a3b8" }}>Color: {order.car.color} · {order.car.mileage?.toLocaleString()} mi</div>
            <div style={{ fontSize: 12, color: "#475569", fontFamily: "monospace" }}>VIN: {order.car.vin}</div>

        </div>

        <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 11, color: "#64748b", fontWeight: 700, textTransform: "uppercase", marginBottom: 6 }}>Service Description</div>

          {master && <div style={{ fontSize: 12, color: "#64748b", marginTop: 6 }}>Technician: {master.name} · {order.hoursSpent} planned hrs @ {fmt(order.laborRate)}/hr</div>}
          {(order.extraWork||[]).length > 0 && (
            <div style={{ marginTop: 10, borderTop: "1px solid #2a3454", paddingTop: 10 }}>

              {(order.extraWork||[]).map((e, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#94a3b8", marginBottom: 3 }}>

                  <span style={{ color: "#fb923c" }}>+{e.hours}h</span>
                </div>
              ))}

        {/* Parts table */}
        <div style={{ fontSize: 11, color: "#64748b", fontWeight: 700, textTransform: "uppercase", marginBottom: 8 }}>Parts & Materials</div>
        <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 16 }}>
          <thead>
            <tr style={{ background: "#0d1424" }}>
              {["Description", "Qty", "Unit Price", "Amount"].map(h => (
                <th key={h} style={{ padding: "8px 12px", textAlign: h === "Description" ? "left" : "right", fontSize: 11, color: "#64748b", fontWeight: 700, textTransform: "uppercase", borderBottom: "1px solid #1e2740" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {order.parts.map((p, i) => (
              <tr key={p.id} style={{ borderBottom: "1px solid #1a2236" }}>
                <td style={{ padding: "9px 12px", fontSize: 13, color: "#e2e8f0" }}>{p.name}</td>
                <td style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#94a3b8" }}>{p.qty}</td>
                <td style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#94a3b8" }}>{fmt(p.price)}</td>
                <td style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#e2e8f0", fontWeight: 600 }}>{fmt(p.qty * p.price)}</td>
              </tr>
            ))}
            <tr>
              <td colSpan={3} style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#64748b" }}>Planned labor ({order.hoursSpent} hrs × {fmt(order.laborRate)})</td>
              <td style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#e2e8f0", fontWeight: 600 }}>{fmt(totals.labor)}</td>
            </tr>
            {totals.extraLabor > 0 && (
              <tr>
                <td colSpan={3} style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#fb923c" }}>
                  ⚠️ Unexpected work ({(order.extraWork||[]).reduce((s,e)=>s+(e.hours||0),0).toFixed(1)} hrs × {fmt(order.laborRate)})
                </td>
                <td style={{ padding: "9px 12px", textAlign: "right", fontSize: 13, color: "#fb923c", fontWeight: 600 }}>+{fmt(totals.extraLabor)}</td>
              </tr>
            )}
          </tbody>
        </table>

        {/* Totals */}
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 16, minWidth: 240 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 13, color: "#64748b" }}>Parts subtotal</span>
              <span style={{ fontSize: 13, color: "#e2e8f0" }}>{fmt(totals.parts)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: totals.extraLabor > 0 ? 6 : 10 }}>
              <span style={{ fontSize: 13, color: "#64748b" }}>Planned labor</span>
              <span style={{ fontSize: 13, color: "#e2e8f0" }}>{fmt(totals.labor)}</span>
            </div>
            {totals.extraLabor > 0 && (
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                <span style={{ fontSize: 13, color: "#fb923c" }}>⚠️ Unexpected work</span>
                <span style={{ fontSize: 13, color: "#fb923c", fontWeight: 600 }}>+{fmt(totals.extraLabor)}</span>
              </div>
            )}
            <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid #2a3454", paddingTop: 10 }}>
              <span style={{ fontSize: 17, fontWeight: 800, color: "#e2e8f0" }}>TOTAL</span>
              <span style={{ fontSize: 20, fontWeight: 800, color: "#60a5fa" }}>{fmt(totals.total)}</span>
            </div>
          </div>
        </div>

        <div style={{ marginTop: 20, padding: "12px 16px", background: "#0d1424", borderRadius: 8, fontSize: 12, color: "#475569", textAlign: "center" }}>
          Thank you for choosing AutoService PRO! · Payment due upon completion · (555) 800-0000
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20, borderTop: "1px solid #1e2740", paddingTop: 20 }}>
        <button onClick={onClose} style={btnGhost}>Close</button>
        <button onClick={handlePrint} style={{ ...btnPrimary, background: "linear-gradient(135deg,#059669,#10b981)", display: "flex", alignItems: "center", gap: 6 }}>
          🖨️ Print Invoice
        </button>
      </div>
    </Modal>
  );
}

// ORDER MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function OrderModal({ order, clients, masters, partsCatalog, onClose, onSave, onInvoice, onStockChange }) {
  const client = clients.find(c => c.id === order.clientId);
  const [data, setData] = useState({
    ...order,
    parts:     order.parts.map(p => ({ ...p })),
    extraWork: (order.extraWork || []).map(e => ({ ...e })),
  });
  const [showCatalog, setShowCatalog] = useState(false);
  const [catalogSearch, setCatalogSearch] = useState("");
  const [catalogCat, setCatalogCat] = useState("All");

  // track which catalogPartIds were added and how many, so we can revert on remove
  const [stockDebits, setStockDebits] = useState({}); // { catalogPartId: qty }

  const u    = (f, v) => setData(d => ({ ...d, [f]: v }));
  const uCar = (f, v) => setData(d => ({ ...d, car: { ...d.car, [f]: v } }));

  const addExtra    = () => setData(d => ({ ...d, extraWork: [...(d.extraWork||[]), { id: Date.now(), description: "", hours: 0 }] }));
  const removeExtra = (id) => setData(d => ({ ...d, extraWork: d.extraWork.filter(e => e.id !== id) }));
  const updateExtra = (id, field, val) => setData(d => ({
    ...d, extraWork: d.extraWork.map(e => e.id === id ? { ...e, [field]: val } : e),
  }));

  const addPart = () => setData(d => ({ ...d, parts: [...d.parts, { id: Date.now(), name: "", qty: 1, price: 0 }] }));

  // Add from catalog — deducts stock immediately
  const addFromCatalog = (catalogPart, qty = 1) => {
    const available = (catalogPart.stock || 0) - (stockDebits[catalogPart.id] || 0);
    if (available < qty) { alert(`Only ${available} units in stock!`); return; }
    setData(d => ({
      ...d,
      parts: [...d.parts, {
        id: Date.now(),
        catalogId: catalogPart.id,
        name: catalogPart.name,
        qty,
        price: catalogPart.price,
        laborHours: catalogPart.laborHours || 0,
      }],
    }));
    setStockDebits(s => ({ ...s, [catalogPart.id]: (s[catalogPart.id] || 0) + qty }));
    setShowCatalog(false);
    setCatalogSearch("");
  };

  // Remove part — return stock if it was from catalog
  const removePart = (orderPart) => {
    if (orderPart.catalogId) {
      setStockDebits(s => ({ ...s, [orderPart.catalogId]: Math.max(0, (s[orderPart.catalogId] || 0) - orderPart.qty) }));
    }
    setData(d => ({ ...d, parts: d.parts.filter(p => p.id !== orderPart.id) }));
  };

  const updatePart = (id, field, val) => setData(d => ({
    ...d, parts: d.parts.map(p => p.id === id ? { ...p, [field]: val } : p),
  }));

  // On Save — commit stock changes to catalog
  const handleSave = () => {
    onStockChange(stockDebits);
    onSave(data);
    onClose();
  };

  const totals = calcTotal(data);
  const statusOpts  = Object.entries(STATUS_MAP).map(([v, s]) => ({ value: v, label: s.label }));
  const masterOpts  = [{ value: "", label: "— unassigned —" }, ...masters.map(m => ({ value: m.id, label: `${m.name} (${fmt(m.hourlyRate)}/hr)` }))];
  const selectedMaster = masters.find(m => m.id === data.masterId);

  const handleMasterChange = (v) => {
    const m = masters.find(x => x.id === parseInt(v));
    u("masterId", v ? parseInt(v) : null);
    if (m) u("laborRate", m.hourlyRate);
  };

  // Live stock = original stock minus debits already applied this session
  const liveStock = (catPart) => (catPart.stock || 0) - (stockDebits[catPart.id] || 0);

  const catalogFiltered = partsCatalog.filter(p => {
    const matchCat = catalogCat === "All" || p.category === catalogCat;
    const matchSearch = p.name.toLowerCase().includes(catalogSearch.toLowerCase()) ||
                        (p.sku||"").toLowerCase().includes(catalogSearch.toLowerCase());
    return matchCat && matchSearch;
  });

  return (
    <>
    <Modal title={`Order #${order.id} — ${client?.name}`} onClose={onClose} wide>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <Field label="Status" half><Select value={data.status} onChange={v => u("status", v)} options={statusOpts} /></Field>
        <Field label="Appointment Date" half><Input type="date" value={data.appointmentDate} onChange={v => u("appointmentDate", v)} /></Field>
      </div>

      {/* CAR */}
      <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: "#7c8db5", fontWeight: 700, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>🚗 Vehicle Info</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          {[["Make","make"],["Model","model"],["Year","year"],["Color","color"],["Mileage","mileage"]].map(([lbl,key]) => (
            <div key={key} style={{ flex: "1 1 110px" }}>
              <label style={{ display: "block", fontSize: 11, color: "#475569", marginBottom: 4 }}>{lbl}</label>
              <input value={data.car[key]} onChange={e => uCar(key, e.target.value)} style={{ ...inputStyle, padding: "7px 10px", fontSize: 13 }} />
            </div>
          ))}
        </div>
        <div style={{ marginTop: 10 }}>
          <label style={{ display: "block", fontSize: 11, color: "#475569", marginBottom: 4 }}>VIN Number</label>
          <input value={data.car.vin} onChange={e => uCar("vin", e.target.value)}
            style={{ ...inputStyle, fontFamily: "monospace", letterSpacing: "0.1em", textTransform: "uppercase" }}
            placeholder="17 characters" maxLength={17} />
        </div>
      </div>

      {/* DESCRIPTION */}
      <Field label="Service Description">
        <textarea value={data.description} onChange={e => u("description", e.target.value)}
          style={{ ...inputStyle, minHeight: 64, resize: "vertical" }} />
      </Field>

      {/* MASTER */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <Field label="Assigned Technician" half>
          <Select value={data.masterId || ""} onChange={handleMasterChange} options={masterOpts} />
        </Field>
        <Field label="Hours Spent" half>
          <Input type="number" value={data.hoursSpent} onChange={v => u("hoursSpent", parseFloat(v) || 0)} placeholder="0.0" />
        </Field>
      </div>
      {selectedMaster && (
        <div style={{ fontSize: 12, color: "#60a5fa", marginTop: -10, marginBottom: 14 }}>
          Rate: {fmt(data.laborRate)}/hr · Planned labor: {fmt(data.hoursSpent * data.laborRate)}
        </div>
      )}

      {/* UNEXPECTED / EXTRA WORK */}
      <div style={{ background: "#1a0f0a", border: "1px solid #7c3b1a", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div>
            <span style={{ fontSize: 12, color: "#fb923c", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>⚠️ Unexpected Work</span>
            <div style={{ fontSize: 11, color: "#78350f", marginTop: 2 }}>Broken bolts, seized parts, hidden damage, etc.</div>
          </div>
          <button onClick={addExtra} style={{ background: "#7c3b1a30", color: "#fb923c", border: "1px solid #7c3b1a60", borderRadius: 6, padding: "5px 12px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>+ Add Item</button>
        </div>
        {(data.extraWork || []).length === 0 && (
          <div style={{ color: "#7c3b1a", fontSize: 12, textAlign: "center", padding: "6px 0" }}>No unexpected issues recorded</div>
        )}
        {(data.extraWork || []).length > 0 && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 16px 90px 80px 24px", gap: 6, marginBottom: 6 }}>
            {["Issue Description", "", "Extra Hrs", "Extra Cost", ""].map((h, i) => (
              <div key={i} style={{ fontSize: 10, color: "#7c350f", textTransform: "uppercase", fontWeight: 700 }}>{h}</div>
            ))}
          </div>
        )}
        {(data.extraWork || []).map(e => (
          <div key={e.id} style={{ display: "grid", gridTemplateColumns: "1fr 16px 90px 80px 24px", gap: 6, marginBottom: 6, alignItems: "center" }}>
            <input value={e.description} onChange={ev => updateExtra(e.id, "description", ev.target.value)}
              placeholder="e.g. Stripped bolt on caliper bracket"
              style={{ ...inputStyle, background: "#1f0d06", border: "1px solid #7c3b1a50", fontSize: 13, padding: "7px 10px" }} />
            <div style={{ fontSize: 14, color: "#7c350f", textAlign: "center" }}>×</div>
            <input type="number" step="0.1" value={e.hours} onChange={ev => updateExtra(e.id, "hours", parseFloat(ev.target.value) || 0)}
              style={{ ...inputStyle, background: "#1f0d06", border: "1px solid #7c3b1a50", fontSize: 13, padding: "7px 10px" }} />
            <div style={{ textAlign: "right", fontSize: 13, color: "#fb923c", fontWeight: 600 }}>+{fmt((e.hours || 0) * data.laborRate)}</div>
            <button onClick={() => removeExtra(e.id)} style={{ background: "none", border: "none", color: "#ef4444", cursor: "pointer", fontSize: 16, lineHeight: 1, padding: 0 }}>×</button>
          </div>
        ))}
        {(data.extraWork || []).length > 0 && (
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8, paddingTop: 8, borderTop: "1px solid #7c3b1a40" }}>
            <span style={{ fontSize: 13, color: "#fb923c", fontWeight: 700 }}>
              Extra time: {(data.extraWork || []).reduce((s, e) => s + (e.hours || 0), 0).toFixed(1)} hrs
              &nbsp;·&nbsp;
              +{fmt((data.extraWork || []).reduce((s, e) => s + (e.hours || 0), 0) * data.laborRate)}
            </span>
          </div>
        )}
      </div>

      {/* PARTS USED */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <span style={{ fontSize: 12, color: "#7c8db5", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>🔩 Parts Used</span>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => setShowCatalog(true)} style={{
              background: "linear-gradient(135deg,#7c3aed20,#1d4ed820)",
              color: "#a78bfa", border: "1px solid #7c3aed50",
              borderRadius: 6, padding: "5px 14px", cursor: "pointer", fontSize: 12, fontWeight: 700,
            }}>📦 Open Parts Catalog</button>
            <button onClick={addPart} style={{ background: "#1d4ed820", color: "#60a5fa", border: "1px solid #1d4ed840", borderRadius: 6, padding: "5px 12px", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>+ Custom</button>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "3fr 60px 90px 90px 24px", gap: 6, marginBottom: 6 }}>
          {["Part Name","Qty","Unit $","Total",""].map(h => (
            <div key={h} style={{ fontSize: 10, color: "#475569", textTransform: "uppercase", fontWeight: 700, textAlign: h === "Total" ? "right" : "left" }}>{h}</div>
          ))}
        </div>
        {data.parts.length === 0 && <div style={{ color: "#334155", fontSize: 13, textAlign: "center", padding: "10px 0" }}>No parts added — use "Open Parts Catalog" to pick from inventory</div>}
        {data.parts.map(p => (
          <div key={p.id} style={{ display: "grid", gridTemplateColumns: "3fr 60px 90px 90px 24px", gap: 6, marginBottom: 6, alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <input value={p.name} onChange={e => updatePart(p.id, "name", e.target.value)} placeholder="Part name" style={{ ...inputStyle, padding: "7px 10px", fontSize: 13 }} />
              {p.catalogId && <span style={{ fontSize: 10, color: "#7c3aed", background: "#7c3aed15", border: "1px solid #7c3aed30", borderRadius: 4, padding: "1px 5px", whiteSpace: "nowrap" }}>catalog</span>}
            </div>
            <input type="number" value={p.qty} onChange={e => updatePart(p.id, "qty", parseInt(e.target.value) || 1)} style={{ ...inputStyle, padding: "7px 8px", fontSize: 13, textAlign: "center" }} />
            <input type="number" value={p.price} onChange={e => updatePart(p.id, "price", parseFloat(e.target.value) || 0)} style={{ ...inputStyle, padding: "7px 10px", fontSize: 13 }} />
            <div style={{ textAlign: "right", fontSize: 13, color: "#60a5fa", fontWeight: 600 }}>{fmt(p.qty * p.price)}</div>
            <button onClick={() => removePart(p)} style={{ background: "none", border: "none", color: "#ef4444", cursor: "pointer", fontSize: 16, lineHeight: 1, padding: 0 }}>×</button>
          </div>
        ))}
      </div>

      {/* TOTALS */}
      <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 14, marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
          <span style={{ fontSize: 13, color: "#64748b" }}>Parts:</span>
          <span style={{ fontSize: 13, color: "#e2e8f0" }}>{fmt(totals.parts)}</span>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
          <span style={{ fontSize: 13, color: "#64748b" }}>Planned labor ({data.hoursSpent} hrs × {fmt(data.laborRate)}):</span>
          <span style={{ fontSize: 13, color: "#e2e8f0" }}>{fmt(totals.labor)}</span>
        </div>
        {totals.extraLabor > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
            <span style={{ fontSize: 13, color: "#fb923c" }}>⚠️ Unexpected work ({(data.extraWork||[]).reduce((s,e)=>s+(e.hours||0),0).toFixed(1)} hrs × {fmt(data.laborRate)}):</span>
            <span style={{ fontSize: 13, color: "#fb923c", fontWeight: 600 }}>+{fmt(totals.extraLabor)}</span>
          </div>
        )}
        <div style={{ display: "flex", justifyContent: "space-between", borderTop: "1px solid #2a3454", paddingTop: 10, marginTop: 5 }}>
          <span style={{ fontSize: 16, fontWeight: 800, color: "#e2e8f0" }}>TOTAL</span>
          <span style={{ fontSize: 20, fontWeight: 800, color: "#60a5fa" }}>{fmt(totals.total)}</span>
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", flexWrap: "wrap" }}>
        <button onClick={onClose} style={btnGhost}>Cancel</button>
        <button onClick={() => onInvoice(data)} style={{ ...btnGhost, color: "#a78bfa", borderColor: "#7c3aed50" }}>📄 View Invoice</button>
        <button onClick={handleSave} style={btnPrimary}>Save Order</button>
      </div>
    </Modal>

    {/* ── PARTS CATALOG PICKER ── */}
    {showCatalog && (
      <div style={{
        position: "fixed", inset: 0, background: "rgba(10,14,26,0.85)",
        backdropFilter: "blur(6px)", display: "flex", alignItems: "center",
        justifyContent: "center", zIndex: 1100, padding: 16,
      }}>
        <div style={{
          background: "#141929", border: "1px solid #2a3454", borderRadius: 16,
          width: "100%", maxWidth: 700, maxHeight: "88vh", display: "flex", flexDirection: "column",
          boxShadow: "0 40px 100px rgba(0,0,0,0.7)",
        }}>
          {/* Header */}
          <div style={{ padding: "18px 24px", borderBottom: "1px solid #1e2740", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 800, color: "#e2e8f0" }}>📦 Parts Catalog</div>
              <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>Select a part to add to this order — stock updates automatically</div>
            </div>
            <button onClick={() => setShowCatalog(false)} style={{ background: "none", border: "none", color: "#64748b", cursor: "pointer", fontSize: 22 }}>×</button>
          </div>

          {/* Search + filter */}
          <div style={{ padding: "12px 24px", borderBottom: "1px solid #1e2740", display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input
              value={catalogSearch} onChange={e => setCatalogSearch(e.target.value)}
              placeholder="🔍  Search by name or SKU..."
              style={{ ...inputStyle, flex: "1 1 200px", padding: "8px 12px" }}
            />
            <select value={catalogCat} onChange={e => setCatalogCat(e.target.value)}
              style={{ ...selectStyle, flex: "0 0 140px", padding: "8px 10px" }}>
              {["All", ...PART_CATEGORIES].map(c => <option key={c}>{c}</option>)}
            </select>
          </div>

          {/* Parts list */}
          <div style={{ overflowY: "auto", padding: "12px 24px", flex: 1 }}>
            {/* Column headers */}
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 80px 80px 70px 100px", gap: 8, marginBottom: 8, padding: "0 4px" }}>
              {["Part","Category","SKU","Price","In Stock",""].map(h => (
                <div key={h} style={{ fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>{h}</div>
              ))}
            </div>

            {catalogFiltered.length === 0 && (
              <div style={{ textAlign: "center", color: "#334155", padding: "30px 0", fontSize: 14 }}>No parts found</div>
            )}

            {catalogFiltered.map(p => {
              const stock = liveStock(p);
              const outOfStock = stock <= 0;
              return (
                <div key={p.id} style={{
                  display: "grid", gridTemplateColumns: "2fr 1fr 80px 80px 70px 100px", gap: 8,
                  background: outOfStock ? "#0a0e1a" : "#0d1424",
                  border: `1px solid ${outOfStock ? "#1a1a2e" : "#1e2740"}`,
                  borderRadius: 10, padding: "10px 12px", marginBottom: 8, alignItems: "center",
                  opacity: outOfStock ? 0.5 : 1,
                }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13, color: "#e2e8f0" }}>{p.name}</div>
                    {p.laborHours > 0 && <div style={{ fontSize: 11, color: "#475569", marginTop: 2 }}>⏱ {p.laborHours}h labor</div>}
                  </div>
                  <div style={{ fontSize: 12, color: "#64748b" }}>{p.category}</div>
                  <div style={{ fontSize: 11, color: "#475569", fontFamily: "monospace" }}>{p.sku}</div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "#60a5fa" }}>{fmt(p.price)}</div>
                  <div>
                    <span style={{
                      fontSize: 12, fontWeight: 700,
                      color: stock > 5 ? "#10b981" : stock > 0 ? "#f59e0b" : "#ef4444",
                      background: (stock > 5 ? "#10b981" : stock > 0 ? "#f59e0b" : "#ef4444") + "20",
                      border: `1px solid ${(stock > 5 ? "#10b981" : stock > 0 ? "#f59e0b" : "#ef4444")}40`,
                      borderRadius: 5, padding: "2px 7px",
                    }}>
                      {outOfStock ? "Out" : `${stock} left`}
                    </span>
                  </div>
                  <button
                    disabled={outOfStock}
                    onClick={() => addFromCatalog(p, 1)}
                    style={{
                      background: outOfStock ? "#1e2740" : "linear-gradient(135deg,#7c3aed,#2563eb)",
                      color: outOfStock ? "#334155" : "#fff",
                      border: "none", borderRadius: 7, padding: "7px 0", cursor: outOfStock ? "not-allowed" : "pointer",
                      fontSize: 12, fontWeight: 700, width: "100%",
                    }}
                  >{outOfStock ? "Out of stock" : "➕ Add to Order"}</button>
                </div>
              );
            })}
          </div>

          <div style={{ padding: "12px 24px", borderTop: "1px solid #1e2740", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 12, color: "#475569" }}>{catalogFiltered.length} parts shown · Stock updates on Save</span>
            <button onClick={() => setShowCatalog(false)} style={btnGhost}>Done</button>
          </div>
        </div>
      </div>
    )}
    </>
  );
}

// NEW ORDER MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function NewOrderModal({ clients, masters, onClose, onCreate }) {
  const [clientId, setClientId] = useState("");
  const [date, setDate] = useState("");
  const [desc, setDesc] = useState("");
  const [car, setCar] = useState({ make: "", model: "", year: "", color: "", vin: "", mileage: "" });

  const clientOpts = [{ value: "", label: "— select client —" }, ...clients.map(c => ({ value: c.id, label: c.name }))];
  const masterOpts = [{ value: "", label: "— unassigned —" }, ...masters.map(m => ({ value: m.id, label: m.name }))];
  const [masterId, setMasterId] = useState("");

  const go = () => {
    if (!clientId || !date) return alert("Please select a client and date.");
    const m = masters.find(x => x.id === parseInt(masterId));
    onCreate({ clientId: parseInt(clientId), appointmentDate: date, description: desc, car, status: "waiting", parts: [], masterId: masterId ? parseInt(masterId) : null, hoursSpent: 0, laborRate: m?.hourlyRate || 45 });
    onClose();
  };

  return (
    <Modal title="New Work Order" onClose={onClose}>
      <div style={{ display: "flex", gap: 12 }}>
        <Field label="Client" half><Select value={clientId} onChange={setClientId} options={clientOpts} /></Field>
        <Field label="Appointment Date" half><Input type="date" value={date} onChange={setDate} /></Field>
      </div>
      <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 16, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: "#7c8db5", fontWeight: 700, marginBottom: 10, textTransform: "uppercase" }}>🚗 Vehicle</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {[["Make","make"],["Model","model"],["Year","year"],["Color","color"],["Mileage","mileage"]].map(([l,k]) => (
            <div key={k} style={{ flex: "1 1 100px" }}>
              <label style={{ display: "block", fontSize: 11, color: "#475569", marginBottom: 4 }}>{l}</label>
              <input value={car[k]} onChange={e => setCar(c => ({...c,[k]:e.target.value}))} style={{ ...inputStyle, fontSize: 13, padding: "7px 10px" }} />
            </div>
          ))}
        </div>
        <div style={{ marginTop: 10 }}>
          <label style={{ display: "block", fontSize: 11, color: "#475569", marginBottom: 4 }}>VIN Number</label>
          <input value={car.vin} onChange={e => setCar(c => ({...c,vin:e.target.value.toUpperCase()}))} style={{ ...inputStyle, fontFamily: "monospace", letterSpacing: "0.1em" }} maxLength={17} />
        </div>
      </div>
      <Field label="Service Description"><textarea value={desc} onChange={e => setDesc(e.target.value)} style={{ ...inputStyle, minHeight: 60, resize: "vertical" }} /></Field>
      <Field label="Assigned Technician"><Select value={masterId} onChange={setMasterId} options={masterOpts} /></Field>
      <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 8 }}>
        <button onClick={onClose} style={btnGhost}>Cancel</button>
        <button onClick={go} style={btnPrimary}>Create Order</button>
      </div>
    </Modal>
  );
}

// CLIENTS TAB
// ═══════════════════════════════════════════════════════════════════════════════
function ClientsTab({ clients, setClients, orders }) {
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ name: "", phone: "", email: "", address: "", notes: "" });
  const [search, setSearch] = useState("");

  const add = () => {
    if (!form.name) return;
    setClients(c => [...c, { id: Date.now(), ...form }]);
    setForm({ name: "", phone: "", email: "", address: "", notes: "" });
    setAdding(false);
  };

  const remove = (id) => {
    if (window.confirm("Remove this customer?")) setClients(cs => cs.filter(c => c.id !== id));
  };

  const visible = clients.filter(c =>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    (c.phone || "").includes(search) ||
    (c.email || "").toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <h2 style={{ margin: 0, fontSize: 20, color: "#e2e8f0" }}>👥 Customers</h2>
        <button onClick={() => setAdding(true)} style={btnPrimary}>+ New Customer</button>
      </div>

      {/* Search */}
      <input value={search} onChange={e => setSearch(e.target.value)}
        placeholder="🔍  Search by name, phone or email..."
        style={{ ...inputStyle, marginBottom: 14 }} />

      {/* Add form */}
      {adding && (
        <div style={{ background: "#141929", border: "1px solid #2a3454", borderRadius: 12, padding: 18, marginBottom: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#e2e8f0", marginBottom: 12 }}>New Customer</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input placeholder="Full Name *" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} style={{ ...inputStyle, flex: "1 1 160px" }} />
            <input placeholder="Phone" value={form.phone} onChange={e => setForm(f => ({...f, phone: e.target.value}))} style={{ ...inputStyle, flex: "1 1 140px" }} />
            <input placeholder="Email" value={form.email} onChange={e => setForm(f => ({...f, email: e.target.value}))} style={{ ...inputStyle, flex: "1 1 180px" }} />
            <input placeholder="Address" value={form.address} onChange={e => setForm(f => ({...f, address: e.target.value}))} style={{ ...inputStyle, flex: "1 1 200px" }} />
            <input placeholder="Notes" value={form.notes} onChange={e => setForm(f => ({...f, notes: e.target.value}))} style={{ ...inputStyle, flex: "1 1 200px" }} />
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 12, justifyContent: "flex-end" }}>
            <button onClick={() => setAdding(false)} style={btnGhost}>Cancel</button>
            <button onClick={add} style={{ ...btnPrimary, background: "#059669" }}>Add Customer</button>
          </div>
        </div>
      )}

      <div style={{ display: "grid", gap: 8 }}>
        {visible.map(c => {
          const cOrders  = (orders || []).filter(o => o.clientId === c.id);
          const totalSpent = cOrders.filter(o => o.status === "done").reduce((s, o) => s + calcTotal(o).total, 0);
          const activeJobs = cOrders.filter(o => o.status === "in_progress" || o.status === "waiting").length;
          return (
            <div key={c.id} style={{ background: "#141929", border: "1px solid #1e2740", borderRadius: 12, padding: "14px 18px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
                {/* Avatar */}
                <div style={{ width: 44, height: 44, borderRadius: "50%", background: "linear-gradient(135deg,#1d4ed8,#7c3aed)", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontWeight: 800, fontSize: 17, flexShrink: 0 }}>
                  {c.name[0].toUpperCase()}
                </div>
                {/* Info */}
                <div style={{ flex: 1, minWidth: 160 }}>
                  <div style={{ fontWeight: 700, color: "#e2e8f0", fontSize: 15 }}>{c.name}</div>
                  <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>
                    {c.phone && <span style={{ marginRight: 12 }}>📞 {c.phone}</span>}
                    {c.email && <span>✉️ {c.email}</span>}
                  </div>
                  {c.address && <div style={{ fontSize: 12, color: "#475569", marginTop: 2 }}>📍 {c.address}</div>}

      <div style={{ display: "grid", gap: 10 }}>
        {masters.map(m => {

                          <span style={{ fontSize: 13, color: "#60a5fa" }}>{fmt(billRt)}/hr</span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                          <span style={{ fontSize: 12, color: "#64748b" }}>💸 Weekly paycheck</span>
                          <span style={{ fontSize: 14, fontWeight: 800, color: "#f59e0b" }}>{fmt(weeklyPay)}</span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>

                          <span style={{ fontSize: 12, color: "#64748b" }}>📈 Labor margin</span>
                          <span style={{ fontSize: 15, fontWeight: 800, color: profit >= 0 ? "#10b981" : "#ef4444" }}>{fmt(profit)}</span>
                        </div>
                      </div>

                    </div>
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// PARTS CATALOG TAB

function PartsTab({ parts, setParts }) {

    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>

                {PART_CATEGORIES.map(c => <option key={c}>{c}</option>)}

            </div>
            <div style={{ flex: "1 1 120px" }}><label style={{ display: "block", fontSize: 11, color: "#475569", marginBottom: 4 }}>SKU</label><input value={form.sku} onChange={e => fld("sku", e.target.value)} style={{ ...inputStyle, fontFamily: "monospace" }} /></div>

            <div style={{ flex: "1 1 100px" }}><label style={{ display: "block", fontSize: 11, color: "#475569", marginBottom: 4 }}>In Stock</label><input type="number" value={form.stock} onChange={e => fld("stock", parseInt(e.target.value)||0)} style={inputStyle} /></div>

            border: filterCat === c ? "1px solid #3b82f6" : "1px solid #1e2740",

          }}>{c}</button>

      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 70px 70px 70px 80px 70px", gap: 8, padding: "6px 14px", marginBottom: 4 }}>
        {["Part Name","Category","SKU","Cost","Price","Margin","Stock","Labor hrs"].map(h => (
          <div key={h} style={{ fontSize: 10, color: "#475569", fontWeight: 700, textTransform: "uppercase" }}>{h}</div>
        ))}
      </div>

      <div style={{ display: "grid", gap: 6 }}>
        {visible.map(p => {
          const margin = p.price > 0 ? Math.round((p.price - p.cost) / p.price * 100) : 0;
          return (
            <div key={p.id} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 70px 70px 70px 80px 70px", gap: 8, background: "#141929", border: "1px solid #1e2740", borderRadius: 10, padding: "10px 14px", alignItems: "center" }}>

              <div style={{ fontSize: 13, color: "#94a3b8" }}>{fmt(p.cost)}</div>
              <div style={{ fontSize: 13, color: "#60a5fa", fontWeight: 600 }}>{fmt(p.price)}</div>
              <div style={{ fontSize: 12, color: margin >= 40 ? "#10b981" : margin >= 20 ? "#f59e0b" : "#ef4444", fontWeight: 600 }}>{margin}%</div>
              <div>
                <span style={{
                  fontSize: 12, fontWeight: 600,
                  color: p.stock > 5 ? "#10b981" : p.stock > 0 ? "#f59e0b" : "#ef4444",
                  background: (p.stock > 5 ? "#10b981" : p.stock > 0 ? "#f59e0b" : "#ef4444") + "20",
                  borderRadius: 5, padding: "2px 7px"
                }}>{p.stock} units</span>
              </div>
              <div style={{ fontSize: 13, color: "#94a3b8" }}>{p.laborHours}h</div>
              <div style={{ display: "flex", gap: 4 }}>
                <button onClick={() => startEdit(p)} style={{ background: "none", border: "none", color: "#60a5fa", cursor: "pointer", fontSize: 13 }}>✏️</button>
                <button onClick={() => remove(p.id)} style={{ background: "none", border: "none", color: "#ef4444", cursor: "pointer", fontSize: 13 }}>🗑</button>
              </div>
            </div>
          );
        })}
        {visible.length === 0 && <div style={{ textAlign: "center", color: "#334155", padding: "30px 0", fontSize: 14 }}>No parts found</div>}
      </div>
    </div>
  );
}

  const taxMultiplier = 1 + (form.salesTax / 100);

      <Section title="Shop Information" icon="🏪">
        <Row label="Shop Name">
          <input value={form.shopName} onChange={e => fld("shopName", e.target.value)} style={inputStyle} />
        </Row>
        <Row label="Address">
          <input value={form.address} onChange={e => fld("address", e.target.value)} style={inputStyle} />
        </Row>
        <Row label="Phone">
          <input value={form.phone} onChange={e => fld("phone", e.target.value)} style={inputStyle} />
        </Row>
        <Row label="Email">
          <input value={form.email} onChange={e => fld("email", e.target.value)} style={inputStyle} />
        </Row>
      </Section>

      {/* LABOR & RATES */}
      <Section title="Labor Rate & Billing" icon="💰">
        <Row
          label="Shop Labor Rate"
          hint="What you charge clients per hour of labor"
        >
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ color: "#64748b", fontSize: 16 }}>$</span>
            <input type="number" value={form.shopLaborRate}
              onChange={e => fld("shopLaborRate", parseFloat(e.target.value) || 0)}
              style={{ ...inputStyle, width: 100, textAlign: "right", fontSize: 20, fontWeight: 700, color: "#60a5fa" }} />
            <span style={{ color: "#64748b", fontSize: 13 }}>/ hr</span>
          </div>
        </Row>
        {/* Visual breakdown */}
        <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 14, marginTop: 4, marginBottom: 4 }}>
          <div style={{ fontSize: 11, color: "#475569", fontWeight: 700, textTransform: "uppercase", marginBottom: 10 }}>Revenue estimate (40 hr week)</div>
          <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
            {[
              { label: "Per Day (8h)", val: form.shopLaborRate * 8, color: "#60a5fa" },
              { label: "Per Week (40h)", val: weeklyRevenue, color: "#a78bfa" },
              { label: "Per Month (~173h)", val: form.shopLaborRate * 173, color: "#10b981" },
            ].map(s => (
              <div key={s.label} style={{ flex: "1 1 120px", textAlign: "center", background: "#141929", borderRadius: 8, padding: "10px 8px" }}>
                <div style={{ fontSize: 16, fontWeight: 800, color: s.color }}>${(s.val).toLocaleString()}</div>
                <div style={{ fontSize: 11, color: "#475569", marginTop: 3 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </Section>

      {/* TAX */}
      <Section title="Sales Tax" icon="🧾">
        <Row
          label="Sales Tax Rate"
          hint="Applied to parts on invoices (labor is usually not taxed)"
        >
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input type="number" step="0.1" value={form.salesTax}
              onChange={e => fld("salesTax", parseFloat(e.target.value) || 0)}
              style={{ ...inputStyle, width: 100, textAlign: "right", fontSize: 20, fontWeight: 700, color: "#f59e0b" }} />
            <span style={{ color: "#64748b", fontSize: 16 }}>%</span>
          </div>
        </Row>
        <div style={{ background: "#0d1424", border: "1px solid #1e2740", borderRadius: 10, padding: 14 }}>
          <div style={{ fontSize: 11, color: "#475569", fontWeight: 700, textTransform: "uppercase", marginBottom: 10 }}>Tax examples</div>
          {[50, 100, 250, 500].map(base => (
            <div key={base} style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 13, color: "#64748b" }}>Parts cost ${base}</span>
              <span style={{ fontSize: 13, color: "#e2e8f0" }}>
                + ${(base * form.salesTax / 100).toFixed(2)} tax
                <span style={{ color: "#f59e0b", fontWeight: 700, marginLeft: 8 }}>= ${(base * taxMultiplier).toFixed(2)}</span>
              </span>
            </div>
          ))}
        </div>
      </Section>

      {/* INVOICE DEFAULTS */}
      <Section title="Invoice Footer" icon="📄">
        <Row label="Payment Note" hint="Shown at bottom of every invoice">
          <input value={form.invoiceNote || "Payment due upon completion"}
            onChange={e => fld("invoiceNote", e.target.value)} style={inputStyle} />
        </Row>
      </Section>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════════
function App() {
  const [tab, setTab]             = useState("orders");
  const [clients, setClients]     = useState(INITIAL_CLIENTS);
  const [masters, setMasters]     = useState(INITIAL_MASTERS);
  const [parts, setParts]         = useState(INITIAL_PARTS);
  const [orders, setOrders]       = useState(INITIAL_ORDERS);
  const [editOrder, setEditOrder] = useState(null);
  const [newOrder, setNewOrder]   = useState(false);
  const [invoiceOrder, setInvoiceOrder] = useState(null);
  const [filter, setFilter]       = useState("all");
  const [settings, setSettings]   = useState({
    shopName: "AutoService PRO",
    address: "123 Mechanic Ave, Auto City, CA 90001",
    phone: "(555) 800-0000",
    email: "info@autoservice.com",
    shopLaborRate: 85,
    salesTax: 8.5,
    currency: "USD",
  });

  const saveOrder  = (u) => setOrders(os => os.map(o => o.id === u.id ? u : o));
  const createOrder = (d) => setOrders(os => [...os, { id: Date.now(), createdAt: new Date().toISOString().slice(0,10), ...d }]);
  const filtered   = filter === "all" ? orders : orders.filter(o => o.status === filter);

  const stats = {
    waiting:     orders.filter(o => o.status === "waiting").length,
    in_progress: orders.filter(o => o.status === "in_progress").length,
    done:        orders.filter(o => o.status === "done").length,
    revenue:     orders.filter(o => o.status === "done").reduce((s, o) => s + calcTotal(o).total, 0),
  };

  const TABS = [
    ["orders",  "📋 Orders"],
    ["parts",   "🔩 Parts"],
    ["masters", "🛠 Technicians"],
    ["clients", "👥 Customers"],
    ["setup",   "⚙️ Setup"],
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#0a0e1a", fontFamily: "'DM Sans','Segoe UI',system-ui,sans-serif", color: "#e2e8f0" }}>
      {/* HEADER */}
      <div style={{ background: "#0d1220", borderBottom: "1px solid #1e2740", padding: "10px 20px", display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 22 }}>🔧</span>
          <span style={{ fontWeight: 800, fontSize: 17, color: "#e2e8f0", letterSpacing: "-0.02em" }}>AutoService</span>
          <span style={{ background: "#1d4ed820", color: "#60a5fa", fontSize: 10, fontWeight: 700, border: "1px solid #1d4ed840", borderRadius: 4, padding: "1px 6px" }}>PRO</span>
        </div>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginLeft: "auto" }}>
          {TABS.map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)} style={{
              background: tab === key ? "#1d4ed8" : "#0d1424",
              color: tab === key ? "#fff" : "#94a3b8",
              border: tab === key ? "1px solid #3b82f6" : "1px solid #1e2740",
              borderRadius: 8, padding: "6px 13px", cursor: "pointer", fontSize: 12,
              fontWeight: tab === key ? 700 : 400,
              boxShadow: tab === key ? "0 0 10px #1d4ed840" : "none",
              whiteSpace: "nowrap",
            }}>{label}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 1140, margin: "0 auto", padding: "28px 20px" }}>

        {/* ── ORDERS TAB ── */}
        {tab === "orders" && (
          <>
            {/* Stats */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))", gap: 12, marginBottom: 24 }}>
              {[
                { label: "Waiting",     value: stats.waiting,         color: "#f59e0b", icon: "⏳" },
                { label: "In Progress", value: stats.in_progress,     color: "#3b82f6", icon: "⚙️" },
                { label: "Completed",   value: stats.done,            color: "#10b981", icon: "✅" },
                { label: "Revenue",     value: fmt(stats.revenue),    color: "#a78bfa", icon: "💰" },
              ].map(s => (
                <div key={s.label} style={{ background: "#141929", border: `1px solid ${s.color}30`, borderRadius: 12, padding: "16px 18px" }}>
                  <div style={{ fontSize: 20, marginBottom: 6 }}>{s.icon}</div>
                  <div style={{ fontSize: 24, fontWeight: 800, color: s.color }}>{s.value}</div>
                  <div style={{ fontSize: 12, color: "#64748b", marginTop: 2 }}>{s.label}</div>
                </div>
              ))}
            </div>

            {/* Toolbar */}
            <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap", alignItems: "center" }}>
              <div style={{ display: "flex", gap: 3, background: "#0d1220", border: "1px solid #1e2740", borderRadius: 8, padding: 3 }}>
                {[["all","All"], ...Object.entries(STATUS_MAP).map(([v,s]) => [v, s.label])].map(([v,l]) => (
                  <button key={v} onClick={() => setFilter(v)} style={{
                    background: filter === v ? "#1d4ed8" : "none",
                    color: filter === v ? "#fff" : "#64748b",
                    border: "none", borderRadius: 6, padding: "5px 11px",
                    cursor: "pointer", fontSize: 12, fontWeight: filter === v ? 600 : 400,
                  }}>{l}</button>
                ))}
              </div>
              <button onClick={() => setNewOrder(true)} style={{ ...btnPrimary, marginLeft: "auto" }}>+ New Order</button>
            </div>

            {/* Order rows */}
            <div style={{ display: "grid", gap: 8 }}>
              {filtered.map(order => {
                const client = clients.find(c => c.id === order.clientId);
                const master = masters.find(m => m.id === order.masterId);
                const totals = calcTotal(order);
                return (
                  <div key={order.id} style={{ background: "#141929", border: "1px solid #1e2740", borderRadius: 12, padding: "13px 16px", cursor: "pointer", display: "grid", gridTemplateColumns: "2fr 2fr 1.4fr 0.8fr 1fr auto auto", gap: 10, alignItems: "center", transition: "border-color .15s" }}
                    onMouseEnter={e => e.currentTarget.style.borderColor = "#3b82f6"}
                    onMouseLeave={e => e.currentTarget.style.borderColor = "#1e2740"}
                    onClick={() => setEditOrder(order)}
                  >
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 14, color: "#e2e8f0" }}>{client?.name || "—"}</div>
                      <div style={{ fontSize: 11, color: "#475569", marginTop: 1 }}>#{order.id} · {order.appointmentDate}</div>
                    </div>
                    <div>
                      <div style={{ fontSize: 13, color: "#cbd5e1" }}>{order.car.make} {order.car.model} {order.car.year}</div>
                      <div style={{ fontSize: 10, color: "#334155", fontFamily: "monospace", marginTop: 1 }}>{order.car.vin}</div>
                    </div>
                    <div style={{ fontSize: 13, color: "#94a3b8" }}>{master?.name || "Unassigned"}</div>
                    <div style={{ fontSize: 13, color: "#64748b" }}>{order.hoursSpent}h</div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#60a5fa" }}>{fmt(totals.total)}</div>
                    <Badge status={order.status} />
                    <button onClick={e => { e.stopPropagation(); setInvoiceOrder(order); }} style={{ background: "#7c3aed20", color: "#a78bfa", border: "1px solid #7c3aed40", borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap" }}>📄 Invoice</button>
                  </div>
                );
              })}
              {filtered.length === 0 && <div style={{ textAlign: "center", color: "#334155", padding: "40px 0", fontSize: 14 }}>No orders found</div>}
            </div>
          </>
        )}

        {tab === "clients" && <ClientsTab clients={clients} setClients={setClients} orders={orders} />}
        {tab === "masters" && <MastersTab masters={masters} setMasters={setMasters} orders={orders} />}
        {tab === "parts"   && <PartsTab parts={parts} setParts={setParts} />}
        {tab === "setup"   && <SetupTab settings={settings} setSettings={setSettings} />}
      </div>

      {editOrder && (
        <OrderModal
          order={editOrder} clients={clients} masters={masters} partsCatalog={parts}
          onClose={() => setEditOrder(null)}
          onSave={saveOrder}
          onInvoice={(o) => { setInvoiceOrder(o); }}
          onStockChange={(debits) => {
            setParts(ps => ps.map(p =>
              debits[p.id] ? { ...p, stock: Math.max(0, p.stock - debits[p.id]) } : p
            ));
          }}
        />
      )}
      {newOrder && <NewOrderModal clients={clients} masters={masters} onClose={() => setNewOrder(false)} onCreate={createOrder} />}
      {invoiceOrder && <InvoiceModal order={invoiceOrder} clients={clients} masters={masters} onClose={() => setInvoiceOrder(null)} />}
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
